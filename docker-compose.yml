services:
  org-a:
    build: ./org-a
    ports:
      - "8001:8000"
    volumes:
      - ./org-a/data:/app/data
    environment:
      - ORG_USERNAME=org_a
      - ORG_PASSWORD=YourRealPassword1
      - JWT_SECRET=YourSharedSecretHere

  org-b:
    build: ./org-b
    ports:
      - "8002:8000"
    volumes:
      - ./org-b/data:/app/data
    environment:
      - ORG_USERNAME=org_b
      - ORG_PASSWORD=YourRealPassword2
      - JWT_SECRET=YourSharedSecretHere

  org-c:
    build: ./org-c
    ports:
      - "8004:8000"
    volumes:
      - ./org-c/data:/app/data
    environment:
      - ORG_USERNAME=org_c
      - ORG_PASSWORD=YourRealPassword3
      - JWT_SECRET=YourSharedSecretHere

  master-ai:
    build: ./master-ai
    ports:
      - "8003:8000"
    volumes:
      - ./master-ai/data:/app/data
    environment:
      - AUTHORITY_USERNAME=authority
      - AUTHORITY_PASSWORD=YourRealAuthorityPassword
      - JWT_SECRET=YourSharedSecretHere